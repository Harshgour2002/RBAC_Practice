spring:
  application:
    name: rbac-service
  datasource:
    url: jdbc:mysql://localhost:13306/rbac
    username: rbac
    password: rbac
    hikari:
      maximum-pool-size: 80
      minimum-idle: 20
      connection-timeout: 250
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:19092
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: rbac-authz
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

management:
  endpoints:
    web:
      exposure:
        include: prometheus,health,metrics
  metrics:
    tags:
      application: rbac-service

security:
  jwt:
    secret: "change-this-secret-to-a-long-random-key-change-this-secret"
    access-token-ttl-seconds: 1800
    refresh-token-ttl-seconds: 604800

resilience4j:
  circuitbreaker:
    instances:
      redisPermissions:
        failure-rate-threshold: 50
        sliding-window-size: 20
  timelimiter:
    instances:
      redisPermissions:
        timeout-duration: 50ms
  retry:
    instances:
      redisPermissions:
        max-attempts: 2
        wait-duration: 5ms
