apiVersion: apps/v1
kind: Deployment
metadata:
  name: rbac-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: rbac-service
  template:
    metadata:
      labels:
        app: rbac-service
    spec:
      containers:
        - name: rbac-service
          image: rbac-service:1.0.0
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "1Gi"
